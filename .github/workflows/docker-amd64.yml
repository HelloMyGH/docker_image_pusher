name: Build Docker AMD64

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

jobs:
  discover-projects:
    name: Discover Projects
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
    - name: Check out code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Get Changed Directories
      id: set-matrix
      run: |
        if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
          CHANGED_DIRS=$(find . -maxdepth 2 -name "Dockerfile" | cut -d'/' -f2 | sort -u)
        else
          if [ "${{ github.event.before }}" = "0000000000000000000000000000000000000000" ]; then
            CHANGED_FILES=$(git diff-tree --no-commit-id --name-only -r HEAD)
          else
            CHANGED_FILES=$(git diff --name-only ${{ github.event.before }} ${{ github.event.after }})
          fi
          CHANGED_DIRS=$(echo "$CHANGED_FILES" | cut -d'/' -f1 | sort -u)
        fi

        JSON_OUTPUT="["
        HAS_VALID_PROJECT=false
        
        for dir in $CHANGED_DIRS; do
          if [ -d "$dir" ] && [ -f "$dir/Dockerfile" ]; then
            HAS_VALID_PROJECT=true
            if [[ "$dir" == *_* ]]; then
              raw_name="${dir%_*}"
              raw_tag="${dir##*_}"
            else
              raw_name="$dir"
              raw_tag="latest"
            fi
            img_name=$(echo "$raw_name" | tr '[:upper:]' '[:lower:]')
            img_tag=$(echo "$raw_tag" | tr '[:upper:]' '[:lower:]')
            JSON_OUTPUT+="{\"dir\":\"$dir\",\"name\":\"$img_name\",\"tag\":\"$img_tag\"},"
          fi
        done

        if [ "$HAS_VALID_PROJECT" = true ]; then
          JSON_OUTPUT="${JSON_OUTPUT%,}]"
          echo "matrix=$JSON_OUTPUT" >> $GITHUB_OUTPUT
        else
          echo "matrix=[]" >> $GITHUB_OUTPUT
        fi

  build-amd64:
    name: Build AMD64
    needs: discover-projects
    # 修复后：使用方括号语法安全访问带连字符的 Job
    if: ${{ needs['discover-projects'].outputs.matrix != '[]' && needs['discover-projects'].outputs.matrix != '' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 修复后：使用方括号语法进行 json 解析
        project: ${{ fromJson(needs['discover-projects'].outputs.matrix) }}
        
    steps:
    - name: Check out code
      uses: actions/checkout@v4

    - name: Setup Docker buildx
      uses: docker/setup-buildx-action@v3

    - name: Cache Docker layers
      uses: actions/cache@v4
      with:
        path: /tmp/.buildx-cache
        key: ${{ runner.os }}-buildx-amd64-${{ matrix.project.dir }}-${{ github.sha }}
        restore-keys: |
          ${{ runner.os }}-buildx-amd64-${{ matrix.project.dir }}-

    - name: Build Docker image
      uses: docker/build-push-action@v6
      with:
        context: ./${{ matrix.project.dir }}
        file: ./${{ matrix.project.dir }}/Dockerfile
        platforms: linux/amd64
        tags: ${{ matrix.project.name }}:${{ matrix.project.tag }}-amd64
        outputs: type=docker,dest=/tmp/image.tar
        cache-from: type=local,src=/tmp/.buildx-cache
        cache-to: type=local,dest=/tmp/.buildx-cache-new,mode=max

    - name: Compress Image
      run: |
        gzip -c /tmp/image.tar > "${{ matrix.project.name }}_${{ matrix.project.tag }}_amd64.tar.gz"

    - name: Upload docker artifact
      uses: actions/upload-artifact@v4
      with:
        name: "${{ matrix.project.name }}_${{ matrix.project.tag }}_amd64"
        path: "${{ matrix.project.name }}_${{ matrix.project.tag }}_amd64.tar.gz"

    - name: Move cache
      run: |
        rm -rf /tmp/.buildx-cache
        mv /tmp/.buildx-cache-new /tmp/.buildx-cache
